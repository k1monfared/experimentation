Chapter 01: the coin
    Framing
        Are everyday coins actually fair?
            - story: Opening question. Coins are designed as currency; fairness is incidental. Tolerances, wear, ref's pocket coin — nobody ever checks.

            - story: Hinted near the end — two different questions hide in the same data.
            - technical: 'Two ways of thinking' section: frequentist asks 'if fair, how often this extreme?', Bayesian asks 'how should my belief change?'. Notation p, p_hat, P(p>0.5).
        Would you even notice a small bias?
            - story: 30 years of brother coin tosses, ~60 extra wins lost in life's noise. Gas-station dice over a weekend.
            - technical: Implicit motivation for Loops C and D.

            - story: Physical flip and the streak — image [story/first_three_tosses.png](chapters/01-the-coin/images/story/first_three_tosses.png).

        Bayesian take on HHH
            - story: Belief-tilt paragraph after the 1/8 pushback: best guess ~0.8, most belief on heads-heavy side, skeptical prior would barely move.
            - technical: Loop A Bayesian take: Beta(1,1) → Beta(4,1); mean 0.8; P(p>0.5) ≈ 0.94. Aside: skeptical prior Beta(50,50) would barely move.

        Seven more tosses → 10 total
            - story: T,T,H,T,H,T,T = 5 of 10. Image [story/ten_tosses.png](chapters/01-the-coin/images/story/ten_tosses.png). Coin 'steadies' — but is the relief earned?

        Fair vs biased coin side by side
            - story: p=0.50 vs p=0.55 at 10,000 tosses each; three-panel L→R reading at N=100/1000/10000; final 50.17% vs 54.76%. Image [story/two_coins_compared.png](chapters/01-the-coin/images/story/two_coins_compared.png).

            - story: A 0.1%-heavy coin would need maybe a million tosses to separate.
            - technical: Loop D Frequentist (no power at N=10) + Bayesian (posteriors are overlapping blobs, mostly prior). Right panel of loop_d_fair_vs_biased.png — 10-toss histograms overlap heavily.
            - code: generate.render_loop_d_overlap (20000 binomial batches per coin)
        Two-lens endcap: CIs from both lenses line up
            - technical: Wilson CI and Bayesian 95% credible interval at N=10/100/1000/10000 sit nearly on top of each other. Image two_lens_endcap.png.
            - code: generate.render_two_lens_endcap
        Fair-or-how-much-not — stakes decide what matters
            - story: Kickoff toss vs running a casino — same data, different decision.
            - technical: Loop D Hunch: the number of tosses needed is not a feeling, it's a calculation.
        Two different questions hide in the same data
            - story: 'If fair, how surprising is this?' vs 'given this, what should I now believe?'. Just notice they're different for now.

        Hand-off: how sure am I, really?
            - story: Closing line that becomes the title of Ch 2.
            - technical: Big-question section: 6/10 — 'is this rigged?'. p=0.75 vs posterior=0.73. Ch 2 introduces null hypothesis, p-value, type I/II errors, posterior tail mass, Bayes factor.
Chapter 02: how sure
    Framing
        How sure am I, really?
            - story: Opening — coffee studies, ninety-five-percent-accurate tests, seventy-percent-chance-of-rain, juries. Each phrase hides a threshold nobody ever pulls apart.
            - technical: Carried from Ch 1: we saw 6/10 heads. Frequentist said p=0.75; Bayesian said P(p>0.5) about 0.73. Two answers, same data. Now make them precise.
        Eggplants, press releases, and the number at the bottom
            - story: Teenager-and-mom anecdote: 'studies show eggplant causes cancer'. The chain ends at a number that passed some threshold.
            - technical: Framing: most of statistics is staring at that number.
        Back to the coin — where is the line?
            - story: At 3 heads, at 5/10, at fractions near half over thousands — how sure am I at each stage? When does 'consistent with fair' become 'convinces me it is fair'?
            - technical: We never know for sure. Both lenses live with that and turn it into something we can act on.
    Loop A
        Imagine 10,000 people each tossing a fair coin 100 times
            - story: The 10,000 imagined crowd: 796 got 50, 780 got 49 or 51, nine got 35, practically none got 25. Image [story/ten_thousand_people.png](chapters/02-how-sure/images/story/ten_thousand_people.png).
            - technical: Loop A Try/Observe: pretend the coin is fair; toss 100 times; ask which counts are common.
            - code: story_generate.render_ten_thousand_people_raw
            - play: [play/many_people_tossing.py](chapters/02-how-sure/play/many_people_tossing.py)
        Raw counts vs percent — same shape
            - story: Same histogram with vertical axis as percent of the crowd. Image [story/what_would_I_see_if_fair.png](chapters/02-how-sure/images/story/what_would_I_see_if_fair.png). Scale-free, so the crowd size stops mattering.
            - code: story_generate.render_what_would_I_see_if_fair
        Fair coins can still produce 35 heads
            - story: About 9 of 10,000 did. Rarely does not mean never. The picture is about how often, not which results are impossible.
            - technical: Loop A Observe: counts at/below 39 or at/above 61 happen about 3.5% of the time combined. That's below the 5% budget because no integer cutoff hits 5% exactly.
        Drawing the surprise line — 80%, 90%, 95%
            - story: Casino friend confirms 95% as the everyday default; physicist friend wants five-sigma. The 95% convention is a convention, not a law.
            - technical: Loop A Frequentist take: the green tail region is the rejection region. Threshold is alpha; turn it up or down as a knob.
            - code: generate.render_sampling_distribution ([images/sampling_distribution_n100.png](chapters/02-how-sure/images/sampling_distribution_n100.png))
        The 5% surprise tails, cutoffs at 39 and 61
            - story: Symmetric two-tailed cutoffs: 39 and below, or 61 and above land in the blue surprise zone. Image [story/surprise_tails.png](chapters/02-how-sure/images/story/surprise_tails.png).
            - technical: Loop A Frequentist: two-sided alpha=0.05 test at N=100 rejects at k<=39 or k>=61.
            - code: story_generate.render_surprise_tails (+ _symmetric_surprise_zone helper)
            - play: [play/threshold_knob.py](chapters/02-how-sure/play/threshold_knob.py)
        Observations on the chart: 50, 55, 60, 65, 70
            - story: Arrows at each observation; 50 and 55 sit in red unsurprising; 65 and 70 are in blue; 60 is just inside the red edge. Image [story/my_observations_on_the_chart.png](chapters/02-how-sure/images/story/my_observations_on_the_chart.png).
            - technical: Same chart underlies the frequentist rejection rule.
            - code: story_generate.render_my_observations_on_the_chart
        Alpha is an upper bound, not a probability the coin is rigged
            - technical: Loop A Bayesian take: with Beta(1,1) prior and 50/100, posterior Beta(51,51), CI about [0.40, 0.60]; at 60/100, Beta(61,41), P(p>0.5) about 0.97. Alpha is an upper bound on false-positive rate, not Prob(rigged | data).
            - code: generate.render_decision_curves (calls coin_posterior_conjugate; [images/decision_curves.png](chapters/02-how-sure/images/decision_curves.png))
    Aside
        How to actually build a biased coin
            - story: Detour: Diaconis says adding mass to a flipped coin barely works; bend the coin into a cup; spin on edge; replace a face. Threshold-shifting in the simulator vs metalwork at home.
            - technical: Not covered (story-only physics aside).
    Loop D
        Biased coin overlaid with fair coin at p=0.55
            - story: Blue fair crowd, red 0.55-biased crowd, side by side at N=100. The two humps overlap heavily around 53. Image [story/fair_vs_biased_overlap.png](chapters/02-how-sure/images/story/fair_vs_biased_overlap.png).
            - technical: Implicit in Loop D — small bias hides inside the fair-coin surprise zone.
            - code: story_generate.render_fair_vs_biased_overlap (seed 202)
    Loop B
        Red zone means 'data not strong enough', not 'coin is fair'
            - story: The rule has an asymmetry: it lets us conclude bias when we see the blue zone, but it never lets us conclude 'fair' from the red zone.
            - technical: Loop B Compare: the frequentist test only ever fails to reject H0; it never accepts it. 'Failed to reject' is not 'believes fair'.
        Both lenses at every possible observation
            - technical: Loop B Try/Observe: for every k from 0 to N, plot frequentist p-value and Bayesian P(p>0.5). At N=10 the two lines cross their thresholds at different k; at N=100 they roughly line up (two-sided freq paired with one-sided posterior — coincidence of the symmetric prior). Image decision_curves.png.
            - code: generate.render_decision_curves
        Prior sensitivity: flat vs skeptical vs heads-low
            - story: Three starting lines meet the same data. Fair-leaning prior barely moves at 60/100; heads-low prior drags up but stays under 0.5; with 600/1000 every prior lands near the same place. Small samples = prior is loud, large samples = data is. Image [story/prior_sensitivity.png](chapters/02-how-sure/images/story/prior_sensitivity.png).
            - technical: Loop B Probe: Beta(50,50) with 6/10 barely moves; with 60/100 moves noticeably; with 600/1000 matches the frequentist. Beta(2,8) at 6/10 gives posterior Beta(8,12), mean 0.4, P(p>0.5) about 0.18.
            - code: story_generate.render_prior_sensitivity
            - play: [play/prior_sensitivity.py](chapters/02-how-sure/play/prior_sensitivity.py)
    Loop C
        Alpha is a knob with consequences in both directions
            - story: Three panels of the same chart at 10%, 5%, 1% in the tails. Image [story/threshold_knob.png](chapters/02-how-sure/images/story/threshold_knob.png). Wider zone = more alarms (some false); narrower zone = fewer alarms but misses real biases.
            - technical: Loop C Try/Observe: sampling distribution at alpha=0.10/0.05/0.01 rejects outside [42,58] / [40,60] / [37,63]. Image alpha_sweep.png.
            - code: story_generate.render_threshold_knob; generate.render_alpha_sweep
        Why not push alpha to zero?
            - story: Zero tails means empty surprise zone, the rule never fires, so the detection rate is also zero. The threshold is the price to pay for firing at all.
            - technical: Loop C Question: no abstract 'right' alpha. The Bayesian counterpart is the credible-interval level and the action threshold on posterior probability.
        Threshold should match stakes
            - story: Beer-round = 10% is fine. Drug-approval = 1% may still be too loose; cost of a missed effect is depriving sick people. Honest reading of p<0.05: a budget for being fooled by chance.
            - technical: Loop C Bayesian counterpart: same trade-off, different control surface (ship if P(beneficial) > 0.95).
    Loop D
        The hump narrows as N grows
            - story: Four overlaid curves at N=50, 100, 500, 5000 on the fraction axis, all centered at 0.5, spread shrinks with N. Image [story/hump_narrows_with_n.png](chapters/02-how-sure/images/story/hump_narrows_with_n.png).
            - technical: Motivates Loop D — bigger N shrinks the unsurprising zone in fraction terms, so small biases can no longer hide.
            - code: story_generate.render_hump_narrows_with_n
    Loop A
        Ask the inverse question — belief curve
            - story: Blank-slate starting point: any bias from 0 to 1 equally plausible. After 60/100, belief curve centered just above 0.6; 95% band runs from about 0.502 to 0.69, with 0.5 just outside the lower edge. Image [story/belief_after_60.png](chapters/02-how-sure/images/story/belief_after_60.png).
            - technical: Loop A Bayesian: Beta(1,1) + 60/100 = Beta(61,41), center 0.598, P(p>0.5) about 0.97. Same math, flipped question.
            - code: story_generate.render_belief_after_60
            - play: [play/belief_curve.py](chapters/02-how-sure/play/belief_curve.py)
    Loop B
        Two answers for 60/100 — procedure vs state of mind
            - story: Way one: 60 lands in the unsurprising zone, rule does not fire. Way two: belief moves, lean toward biased but only by a hair. Courtroom analogy: burden of proof vs juror's quiet hunch.
            - technical: Loop B Hunch: both lenses can say 'I am 95% sure' but 'sure of what?' differs. Frequentist conditions on H0; Bayesian assigns posterior probability to p given prior and model.
        Each lens fails differently
            - technical: Frequentist fails when we want to believe something rather than merely fail to reject. Bayesian fails when a public decision cannot depend on whose prior. Bayes factor deferred to Ch 6.
    Loop D
        How often does the rule fool me?
            - story: 1000 fake experiments at truths p=0.50/0.52/0.55/0.60 across N=50/200/1000. Image [story/how_often_I_get_fooled.png](chapters/02-how-sure/images/story/how_often_I_get_fooled.png). Fair coin: about 5% alarms at every N (the budget). Slightly biased (0.52) at N=1000: about 20% catch rate.
            - technical: Loop D Try/Observe: 2000 experiments per cell. Under p=0.50, 3-5% rejections (discrete test is conservative). At p=0.52: 4%/7%/23%. At p=0.55: 8%/26%/88%. At p=0.60: 23%/79%/~100%. Image rejection_rates.png.
            - code: story_generate.render_how_often_I_get_fooled (seed 303, 1000 trials); generate.render_simulated_decisions (seed 200, 2000 experiments, uses simulate_rejection_rate)
            - play: [play/rule_fooling_rate.py](chapters/02-how-sure/play/rule_fooling_rate.py)
        Three knobs at once: bias size, N, threshold
            - story: Small bias hidden in small experiment looks like a fair coin. Most of real life lives in the middle of the chart.
            - technical: Loop D Hunch: 'how often will I be fooled' depends on alpha, N, and the truth. Alpha controls false positives; N+truth control true positives.
        Same machinery, different clothes
            - story: Drug trials, juries at beyond-reasonable-doubt, weather forecasts as belief curves, 95%-accurate tests with 1-in-1000 prevalence giving mostly false positives. Same shape in serious clothes.
    Hand-off
        Hand-off: how big a sample do I need?
            - story: For a 1pp lift, how many tosses? Rule has a threshold for false alarms but not for catching real things. Where does that come from?
            - technical: Big question opening Ch 3: power. Given an effect worth catching, how do we plan N so the test actually catches it?
Chapter 03: power
    Framing
        Carry-over: the rule catches unfair but cannot certify fair
            - story: Opens by restating the Ch 2 surprise-zone rule and its blind spot: 52% bias is nearly invisible at N=100. The rule's strength depends on how much data you have.
            - technical: Carried-from-Ch 2: rejection rule catches large biases, misses small ones. Now plan N to catch a specific bias.
    Loop B
        Real institutions set N on purpose
            - story: Drug trials (3000 vs 40 patients), polls (1000 calls, +/-3pp margin), A/B tests (millions of users for 0.25pp lift). Each pre-computes a target N.
            - technical: Hunch (Loop B): huge tech companies run huge trials because their effects are tiny. 0.5pp lift on 5% baseline is real money.
    Loop A
        Power = probability the rule fires when the bias is real
            - story: Picks bias=0.55, tosses 100, asks how often the surprise rule catches it. Answer ~17%, misses ~5 times out of 6.
            - technical: Loop A Try/Observe: for p=0.55 vs null p=0.5, N=100 gives power ~17%, N=1000 gives 88%, N=10000 essentially 1. Vocabulary: power = 1 - beta., generate.render_power_curves (effects [0.51, 0.52, 0.55, 0.60
            - code: 0.70]); story_generate.render_detection_grows_log (two-sided alpha=0.05)
            - play: [play/power_explorer.py](chapters/03-power/play/power_explorer.py)
    Framing

Chapter 05: confidence intervals
    Framing
        Carry-over question from Ch 4
            - story: Opening: tests answer yes-or-no on one value, but I usually want a range of plausible biases.
            - technical: Carried from Chapter 4: tests rule out one value; intervals invert the question — what set can I NOT rule out?
        Test-interval duality
            - story: Stated plainly: for every test there is a set of values the test fails to reject, and that set is the confidence interval.
            - technical: Framing: intervals are the dual of tests. If a test rejects 0.5, then 0.5 is outside the interval; if it fails to reject, 0.5 is inside.
        Intervals in the wild
            - story: Polling margin of error (53±3), BLS unemployment 3.7% ±0.2, drug survival 2.1 months CI 0.4–3.8. Readers round to the headline and lose the band.
            - technical: Not covered (story-only motivation).
    Loop A
        Wald / simple bell-curve interval defined
            - story: Falls out of treating the binomial as normal: p̂ ± 1.96·SE. For 60/100 gives 0.504–0.696. Named after Abraham Wald (1940s).
            - technical: Loop A Try lists Wald as one of five methods alongside Wilson, Clopper-Pearson, percentile bootstrap, Bayesian.
            - code: story_generate.wald_ci helper; generate uses statsmodels proportion_confint method="normal".
        Four procedures on three observations
            - story: Three panels at 6/10, 60/100, 600/1000 showing four stacked intervals each. Image [story/intervals_at_observations.png](chapters/05-confidence-intervals/images/story/intervals_at_observations.png).

            - play: [play/interval_calculator.py](chapters/05-confidence-intervals/play/interval_calculator.py)

            - story: At 6/10 the four intervals visibly disagree; at 600/1000 they are indistinguishable. Data dominates the choice of method eventually.
            - technical: Loop A Hunch: at moderate-to-large N the method does not matter; at small N or extremes the bad ones get embarrassingly wrong.

            - story: Wilson (1927). Pulls the centre toward 0.5 by an amount that depends on N. Significant at 10 tosses, invisible at 10000.

    Framing

            - story: Three panels at N=60, 600, 6000 of a fair die; counts wobble large then settle into a tight band within 1-2% of N/6. Image [story/face_counts_wobble.png](chapters/07-the-die/images/story/face_counts_wobble.png).

Chapter 16: metric quality
    Framing
        Carried question: more sensitive tests without more data
            - story: Opening frame: halving minimum detectable effect costs 4x sample; some techniques beat that scaling by subtracting needless variation.
            - technical: Carried from Ch 15: even good metrics wobble, we tame the wobble.
        Real-world hook: Microsoft CUPED
            - story: CUPED (2013) cut A/B test variance 30 to 50 percent at Microsoft with no added users by using each user's pre-experiment behavior.
            - technical: Carried-from anchor: Microsoft CUPED 2013 result named at the top of the chapter.
        Real-world hook: adjusted sports and stratified clinical trials
            - story: Shot-difficulty-adjusted shooting percentage and stratified randomization in Phase 3 trials as analogues of the same 'subtract needless variation' trick.
            - technical: Carried-from anchor: sports and Phase 3 stratification named as cross-domain analogues of the same trick.
    Loop A
        A/B on revenue per user, between-user variance dominates
            - story: Simulator frame: one big spender adds more variance than ten small spenders; per-user averaging converges but slowly.
            - technical: Loop A Try/Observe: three candidate metrics wrap the same truth (mean 10, std 2) with noise std 1, 5, 0.3. High-variance metric needs ~25x more users for the same power. Image [images/variance_comparison.png](chapters/16-metric-quality/images/variance_comparison.png).

        Variance is a property of the metric, not the truth
            - technical: Loop A framing: the underlying user value is identical, only metric noise differs, so sample size scales with the metric choice.
            - code: generate.render_variance_comparison
    Loop B
        CUPED as y minus theta times centered pre-covariate
            - story: Walk-through: difference between during-experiment and pre-experiment revenue is what's informative, baseline is noise.
            - technical: Loop B Try: y_adj = y - theta*(x - x_mean), theta is single-covariate OLS slope; extends to vector theta with multiple pre-experiment covariates via y - X_centered @ theta.
            - code: generate.render_cuped uses expkit.metrics.variance.cuped + variance_reduction_ratio (seed 0); story_generate.render_cuped_variance_reduction computes theta inline (seed 16)

        Covariate must be measured pre-treatment
            - story: Story paragraph after the CUPED math: covariate must be measured pre-treatment or the adjustment absorbs part of the effect.
            - technical: Loop B caveat: if the covariate is post-treatment, theta can absorb part of the effect and bias the adjusted outcome. Note that expkit.metrics.variance.cuped takes an arm argument but currently ignores it.
        CUPED shrinks variance by about half on correlated data
            - story: Side-by-side raw-vs-adjusted scatter, SE falls from se_raw to se_cuped, labeled variance reduction. Image [story/cuped_variance_reduction.png](chapters/16-metric-quality/images/story/cuped_variance_reduction.png).
            - technical: Loop B Observe: on simulated strongly-pre-correlated data, CUPED removes ~50% of the variance. Image [images/cuped.png](chapters/16-metric-quality/images/cuped.png).

            - play: [play/cuped_demo.py](chapters/16-metric-quality/play/cuped_demo.py)
        Free statistical power from pre-experiment data
            - story: 25% variance reduction ~= 33% larger experiment; 50% reduction ~= doubling the sample.
            - technical: Loop B Hunch: free power given pre-experiment data. Ch 3's required-N assumed raw outcome variance; CUPED roughly doubles effective N.
        CUPED generalizes to any predictive pre-experiment covariate
            - story: Demographics, prior engagement, tenure, geo, pre-experiment revenue; modern variants include stratification, regression adjustment, ML residual prediction.
            - technical: Mentioned obliquely as the multi-covariate extension in Loop B.
    Loop C
        Metric stability as the second quality dimension
            - story: Some metrics are intrinsically noisier. Conversion rate has known binomial variance; revenue per user is skewed and bootstrap is safer.
            - technical: Opening frame of Loop C: is the pipeline reporting zero when nothing is happening?
        A/A test: two arms from the same population
            - story: Practical check. Mature programs run A/A tests as part of the pipeline and characterize the noise; metrics that fail A/A routinely cannot be used.
            - technical: Loop C Try: 5,000 A/A tests at N=500 per arm with no real effect, plot the measured-effect distribution.

            - code: story_generate.render_aa_test_distribution
        Shape check vs calibration check
            - story: Story A/A section: 'two questions buried inside an A/A check' contrasts the easy shape check against the harder calibration check.
            - technical: Loop C caveat: fraction beyond 1.96 * empirical std is ~5% by construction under any symmetric distribution; that is a shape check, not calibration.
            - code: generate.render_aa_stability
        Empirical rejection rate against nominal alpha
            - story: Story A/A section: real report is the empirical rejection rate, not the pooled-spread fraction.
            - technical: Loop C Try (calibration): use each trial's own p-value via Welch t-test and call expkit.metrics.quality.aa_calibration(p_values, alpha=0.05).

            - story: Story A/A section: 5000 trials yield ~250 rejections, 95% CI ~[0.045, 0.055] brackets alpha.
            - technical: Loop C Observe (calibration): empirical rejection rate ~ 0.0498, 95% Wilson CI ~ [0.045, 0.055]; the CI brackets 0.05 so the pipeline is calibrated.
            - code: generate.render_aa_stability

            - technical: Loop C Hunch: the right summary is empirical rejection rate vs alpha with its own CI, not the tautological fraction past the empirical 1.96-std band.
    Loop D
        Predictivity: short-term vs long-term effects
            - story: Third dimension of quality: a low-noise metric is useless if it doesn't predict the thing you care about; high noise plus high validity can still beat low noise plus irrelevance.
            - technical: Loop D Try: pair short-term and long-term effects across 200 simulated experiments for three metrics (good, noisy, liar) and call predictivity(short, long, n_boot=1000, seed=0).
            - code: generate.render_predictivity_grid using expkit.metrics.quality.predictivity (seed 7)
        Good, noisy, and lying metrics separable at N=200
            - story: Story predictivity paragraph: three kinds of short-term metric come apart at N=200 paired experiments; at N=30 their bootstrap CIs overlap.
            - technical: Loop D Observe: good r ~ +0.6 [+0.50, +0.69]; noisy r ~ 0 [-0.14, +0.14]; liar r ~ -0.3 [-0.42, -0.16]. Image [images/predictivity_grid.png](chapters/16-metric-quality/images/predictivity_grid.png). At N=30 the CIs would overlap.

        Goodhart's law behind negative predictivity
            - story: Story predictivity paragraph also carries Goodhart: optimizing the proxy lifts the proxy and burns the outcome, hence negative r for the lying metric.
            - technical: Loop D Hunch: predictivity is a metric of metrics; weight short-term metrics by measured predictivity, don't optimize them directly. Goodhart explains the negative-r case.
        Bayesian counterpart of Loop C via Beta-binomial
            - story: Story two-lens paragraph: Beta(1,1) prior plus 5000 A/A outcomes gives posterior mean ~0.050, 95% CrI ~[0.044, 0.056], P(r>0.05) ~ 0.49.
            - technical: Two-lens: treat ~249 of 5,000 rejections as binomial with Beta(1,1) prior, call expkit.inference.bayes.coin_posterior_conjugate on the 0/1 reject indicators to get Beta(250, 4751). Posterior mean ~0.0500, 95% CrI ~[0.044, 0.056], P(r>0.05) ~ 0.49.
        Two-lens agreement when data drown the prior
            - story: Story two-lens paragraph: frequentist Wilson and Bayesian posterior agree because data are plentiful and prior is weak; at 50 trials Wilson CI is wide, posterior still calibrated.
            - technical: Two-lens commentary: frequentist Wilson and Bayesian posterior agree here; they would diverge at ~50 A/A trials where the Wilson CI is wide and the posterior is still calibrated.
        Bayesian paths for Loops B and D named, not shipped
            - technical: Two-lens for B: regression of y on x with Normal(0,1) prior on theta and posterior over variance reduction. For D: posterior over Pearson rho via Fisher z or bivariate Normal. Expkit does not ship these; the frequentist tools suffice at this chapter's sample sizes.
        Real-world close: CUPED, stratification, park-adjusted stats
            - story: Microsoft CUPED is now standard at most large tech A/B platforms; Phase 3 cancer trials stratify on prior treatment, performance status, stage; baseball adjusts for park, opponent, pitcher hand.
            - technical: Echoes Loops A and B in production practice.

Chapter 18: frequentist vs bayesian shipping
    Framing
        Capstone question: do the two lenses ship differently?
            - story: Opening frame: after parallel lenses all book, would they produce different ship/no-ship calls? On which cases? At what cost?
            - technical: Carried from Ch 17: seventeen chapters of two-lens analysis, now we put both rules on the same 2,000 experiments and count.
        Real-world hybrid practice
            - story: Microsoft ExP (2017): Bayesian and frequentist agreed on ~95% of A/B decisions. Booking.com mixes the two by context. FDA/EMA accept Bayesian for rare-disease and adaptive trials, still require frequentist primary for most phase 3.
            - technical: Not covered (story-only real-world framing).
        Framework choice is operational, not theological
            - story: Each org picks a lens based on data shape, cost of error, and audit trail, not ideology.
            - technical: Chapter framing: which rule a team writes down depends on what kind of call it is.
    Loop A
        The two decision rules in the wild
            - story: Frequentist: ship if p < 0.05 and point estimate > 0. Bayesian: ship if P(lift > MMU) > 0.95.
            - technical: Loop A Try: same two rules, with MMU = 0.5pp drawn from Ch 8's minimum meaningful uplift.
            - code: generate.run_simulator (seed 180)

            - technical: Loop A note: wild rules aren't structurally matched (F has no meaningfulness gate, B does). Simulator also records a matched F rule, ship if p < 0.05 AND point estimate > MMU, to separate lens effect from MMU effect.

        Population of true effects drives the numbers
            - story: Story note: bell-shaped population of true effects centered at zero drives the numbers; heavy-tailed, skewed, or mostly-zero populations would shift the sharpness of the verdicts.
            - technical: Loop A Population caveat: true_diff drawn from Normal(0, 1pp). ~38% of mass within ±MMU and ~95% within ±2pp. Heavy-tailed or skewed populations would shift the trade-offs.

        1,000 simulated A/B tests, both rules in parallel
            - story: Thought experiment: a thousand tests with varied true effects, two rules applied to each.

        Joint rule: ship only if both agree
            - story: Story note: a joint rule (ship only when both lenses agree) tracks the more conservative lens, costing a few marginal wins in exchange for a defensible audit trail.
            - technical: Loop E Try + Observe: joint ship rate tracks B's (the more conservative). At MMU and below, joint ships are rare; at truth in (0.010, 0.020] ~0.20; at (0.020, 0.050] ~0.60 (Wilson 95% CI ~0.45–0.74). Image joint_decision.png.
            - code: generate.render_joint_decision
        Joint rule is conservative but defensible
            - technical: Loop E Hunch: 'both must agree' costs a few marginal wins but buys a defensible audit trail, shipped because both frames said yes.
        Discovered bug in the simulator
            - technical: Chapter note: original run_simulator reseeded the per-run RNG to a constant inside the loop, correlating Monte-Carlo noise on the Bayesian P(diff > MMU) across all 2,000 experiments (bias ~0.008 in SE). Fixed by spawning a per-run rng from the outer rng; F-only-ship cell most likely to shift.
            - code: generate.run_simulator (comment documents the fix, now local = default_rng(rng.integers(...)))
        Framework wars are smaller than the question
            - story: The question is the thing. A wrong question answered well with either lens is still wrong, a right question survives imperfect frameworks.
            - technical: Distilled two-lens commentary: lenses are complementary, not competitors. Agreement on clear cases, divergence flags the borderline experiments worth a judgement call.
    Hand-off
        Hand-off: what about when we can't run the experiment?
            - story: Closing line: randomization isn't always possible (smoking, policies, parents). A different framework, causal inference, takes over.
            - technical: Big question for Ch 19: when do experiments stop being enough?
Chapter 19: causal handoff
    Framing
        Handoff from Chapter 18
            - story: Opening: some questions cannot be answered by randomized experiment. This chapter is the handoff.
            - technical: Carried question from Ch 18: when do experiments stop being enough? Eighteen chapters of experiments; we still hit walls where experimentation hands the baton to causal inference.
    Loop A
        Smoking causes cancer
            - story: Decades to settle, never by experiment. Doll and Hill's case-control (1950) and cohort (1956), Bradford Hill's nine criteria (1965), Surgeon General reports; Fisher's shared-genetic-cause counter took years to refute.
            - technical: Loop A iconic-cases bullet: Doll and Hill (1950, 1956) plus Bradford Hill's nine criteria (1965) as the canonical non-experimental case.
        Climate attribution
            - story: You cannot randomize the planet. Case built from observational data, climate models, paleo-records, counterfactual simulations; IPCC synthesizes into 'very likely' and 'extremely likely'.
            - technical: Loop A iconic-cases bullet: observational data plus counterfactual simulations, IPCC synthesis.
        College and earnings
            - story: People who go to college differ from those who do not before they start. Modern econometrics uses instrumental variables (proximity to college) and natural experiments (compulsory schooling laws) to isolate the causal effect.
            - technical: Loop A iconic-cases bullet: self-selection on unobservables, econometric instruments (proximity to college, compulsory schooling).
        Ethically unrandomizable interventions
            - story: Child-rearing, traumatic exposure, decades-long dietary patterns: observational, contaminated comparisons, causal structure must be reasoned about explicitly.
            - technical: Loop A Ethics bullet: cannot randomly deny vaccinations, education, or basic income to a control arm.
        Why the simulator stops helping
            - story: Away from the simulator: its feature is that I controlled the assignment. When I lose control, the same math gives wrong answers.
            - technical: Loop A framing: randomization is the thing the previous chapters relied on; without it, different machinery is needed.
        Long horizons block randomization
            - story: Story paragraph: five-year horizons lose users to attrition and environment change, so the thing measured is no longer the thing assigned.
            - technical: Loop A bullet: 5+ year horizons suffer contamination, attrition, environment change; career outcomes and public-health interventions only make sense at those horizons.
        Network effects break SUTVA
            - story: Story paragraph: treat one user on a social network and friends change behaviour; stability-of-treatment-value assumption breaks and the standard math quietly gives wrong answers.
            - technical: Loop A bullet: treating user A changes A's friends' behaviour; SUTVA (no interference, one version of treatment) is violated; need cluster randomization, partial-interference designs, graph methods.
        Observational data and one-time events
            - story: Story paragraph: one-time events (policy change, competitor pivot, pandemic) happen once, to everyone, with no untreated counterfactual.
            - technical: Loop A bullets: historical logs have no random assignment; regime changes, competitor pivots, pandemics have no untreated counterfactual.
            - code: generate.render_when_experiments_fail (text-panel figure when_experiments_fail.png)
    Loop B
        Selection bias: HRT case
            - story: HRT users had fewer cardiovascular events in observational data; RCT showed the opposite. HRT users were healthier, more affluent, more health-conscious, confounding the comparison.
            - technical: Motivating example for Loop B (mirrors the dilution chapter's HRT reference).
        Naive observational comparison overstates effect
            - story: Selection-bias demo: scatter of propensity vs outcome for treated and control, plus bar chart 'naive vs true'. Image [story/selection_bias.png](chapters/19-causal-handoff/images/story/selection_bias.png). Naive diff is more than 3x the truth.
            - technical: Loop B Try/Observe: 5,000 users, latent propensity, treatment ~ sigmoid(propensity), true effect +0.30, outcome = propensity + 0.30*treated + noise; naive diff approx +1.0. Image selection_bias.png.
            - code: story_generate.render_selection_bias (seed 19, n=2000); generate.render_selection_bias (seed 190, n=5000)
            - play: [play/selection_bias.py](chapters/19-causal-handoff/play/selection_bias.py)
        Propensity as confounder
            - technical: Loop B Observe + right panel of selection_bias.png: treated and untreated differ on baseline propensity; the gap is selection, not treatment.
            - code: generate.render_selection_bias (right panel histograms of propensity by arm)
        Rubin's decomposition (SDO = ATE + selection + HTE)
            - technical: Loop B Hunch: simple difference in outcomes decomposes into ATE + selection bias + HTE bias. With constant +0.30 effect, HTE term vanishes; the ~0.70 gap is pure selection bias.
        Think about the data-generating process
            - story: First tool of causal inference: what variables affect treatment and outcome, and are they correlated. Those are confounders.
            - technical: Loop B Hunch (continued): the central problem causal inference solves when randomization is impossible.
        DAGs and adjustment
            - story: Statisticians and epidemiologists draw the directed acyclic graph. Rules specify which adjustments make the comparison valid (confounders) and which make it worse (mediators on the causal path).
            - technical: Loop B hunch bullet: DAGs make the DGP explicit, adjust for confounders, do not adjust for mediators.
        Natural experiments
            - story: John Snow's 1854 cholera study: two water companies, one with contaminated Broad Street pump, similar residents either side of the boundary; assignment by old contract, not health. Vietnam draft lottery, twin studies, same-sex siblings, school cutoff dates.
            - technical: Loop B hunch bullet: John Snow 1854, draft lotteries, twin studies, same-sex siblings, school cutoff dates as as-good-as-random assignments.
        Instrumental variables
            - story: Variable randomly distributed, affects only treatment and not outcome directly; compulsory schooling laws as instrument for years of education is the textbook case.
            - technical: Mentioned in Loop B Hunch list of causal-inference tools.
        Matched studies
            - story: Match each treated subject to an untreated subject with similar pre-treatment characteristics. Catch: you have to know all the relevant confounders, which you rarely do.
            - technical: Mentioned in Loop B Hunch list of tools.
    Loop C
        Potential outcomes (Rubin) vocabulary
            - story: Story paragraph: for each person there is the outcome they would have had if treated and if not; I only see one; randomization makes assignment independent of both.
            - technical: Loop C: each unit has Y(0) and Y(1); we see one or the other. The book has used this implicitly since Ch 8; now it is named. ATE = E[Y(1)-Y(0)]; selection bias = E[Y(0)|treated] - E[Y(0)|untreated]; identification as the joint question of data + assumptions.
        Reusable machinery across the handoff
            - story: Confidence intervals and Bayesian posteriors still work conditional on the model; what changes is the need to specify and defend the data-generating process.
            - technical: Closing thought: the book's machinery designs, runs, and interprets experiments; the causal repo asks 'what would have happened' without one. Knowing when to reach for which is the skill.
    Hand-off
        Sibling repo and Mixtape handoff
            - technical: Handoff section: serious treatment lives in /home/k1/public/statistics/causal_inference, built on Scott Cunningham's Mixtape Sessions (potential outcomes, perfect doctor vs random assignment, Thornton HIV experiment).
        End of the book, hand-off to the reader
            - story: Closing line: if I can stay honest with the coin in my hand, I have a chance of staying honest about the things that actually matter. The coin has been a good companion; drugs, polls, A/B tests, verdicts, climate attribution all live inside the same machinery.
            - technical: Big question handed to the reader: when do experiments stop being enough, in your domain?
Appendix A1: mcmc diagnostics
    Framing
        When the computer is doing the math, how do I know it is right?
            - story: Opening frame: most Bayesian results came out of simulations; samplers can fail and return histograms that look right but are not.
            - technical: Appendix framing carried from Chapter 6: the single-parameter coin trace looked perfect because it was the easy case; real work needs diagnostics like bloodwork.
        Real-world stakes: a 2014 psychology reanalysis
            - story: 2014 hierarchical psychology paper: MCMC had not converged; reanalysis with a corrected sampler gave different numbers. Error was in the implementation, not the model.
    Loop C
        Framework vs implementation
            - story: Bayesian framework is rigorous; implementation has gotchas. Diagnostics are the line between 'reliable' and 'looks reliable'.
            - technical: Closing hunch of Loop C restates this layered view: R-hat, ESS, and divergences each catch a different kind of implementation failure.
    Loop B
        Why MCMC can fail
            - story: Chains approximate the posterior via a Markov chain that is only guaranteed to converge asymptotically; finite runs can drift, have segment-dependent shape, or miss parts of the distribution.
            - technical: Motivates all three Loops; Loop B makes the failure concrete on Neal's funnel.
    Loop A
        Fit Chapter 6's coin model as a baseline
            - technical: Loop A Try: 200 tosses of p=0.55, Beta(1,1) prior, 4 chains x 2000 draws + 1000 tune. Save InferenceData and read the four default diagnostics.
            - code: generate.render_healthy_chains (seed 7 for data; sampler seed 606)
        Healthy trace: R-hat, ESS, divergences
            - technical: Loop A Observe: R-hat = 1.000, ESS ~ 6000 out of 8000 raw, 0 divergences, autocorrelation drops by lag 5. Image healthy_chains.png.
            - code: generate.render_healthy_chains
        Healthy vs unhealthy trace side by side
            - story: Trace plots explained: a healthy chain looks like a fuzzy caterpillar; an unhealthy one sticks, drifts, or separates. Image [story/good_vs_bad_trace.png](chapters/A1-mcmc-diagnostics/images/story/good_vs_bad_trace.png).
            - technical: Loop A Observe notes the same fuzzy-caterpillar idea and absence of drift/clumps in the coin trace.
            - code: story_generate.render_good_vs_bad_trace (seed 606)
        On easy problems the sampler is invisible
            - technical: Loop A Hunch: on a well-conditioned problem you write the model, sample, summarize; diagnostics confirm there is nothing to see. The rest of the appendix is the cases where there is.
        R-hat: what it measures
            - story: Potential scale reduction factor. Near 1.0 (below 1.01 or 1.05) is good; above 1.1 is a warning.
            - technical: Loop A Observe defines R-hat as between-chain vs within-chain variance; Loop C Observe sets the concern threshold at > 1.01.
        ESS: effectively independent draws
            - story: If 4000 draws are highly autocorrelated, ESS might be 200; that is the variance-equivalent count. Hundreds is usually fine; under 100 is a warning.
            - technical: Loop A Observe reports ESS ~ 6000 / 8000; Loop C Observe: concern when ESS for a reported quantity is under a few hundred; fix by drawing more or reparameterizing.
        Divergences in HMC / NUTS
            - story: Small numbers are usually fine; many divergences flag difficult geometry.
            - technical: Loop A Observe: a divergence means the trajectory ran off the posterior curve because step size could not adapt. Loop C Observe: any positive count is a concern for a model you trust; first fix is target_accept=0.95.
    Loop B
        Neal's funnel: the classic bad geometry
            - technical: Loop B Try: hierarchical model theta_i = mu + tau * z_i with z_i ~ Normal(0,1) and tau ~ HalfNormal(1). Joint posterior on (tau, z_i) is an inverted funnel: wide mouth at large tau, pinched neck at small tau.
            - code: generate.render_funnel (sampler seed 11; 8 latent groups; no data, prior funnel only)
        Centered vs non-centered parameterization
            - technical: Loop B Try: same model written two ways: theta_i ~ Normal(mu, tau) vs theta_i = mu + tau * z_i with z_i standardized.
            - code: generate.render_funnel fits both forms in one call
        Centered run fails, non-centered run passes
            - technical: Loop B Observe: centered finishes with 60-200 divergences, R-hat > 1.05 on tau, ESS ~ 200; non-centered gives 0-3 divergences, R-hat 1.00, ESS ~ 5000 on tau. Image funnel_centered_vs_noncentered.png.
            - code: generate.render_funnel reports div / rhat_tau / ess_tau for both forms
        Why non-centering fixes HMC geometry
            - technical: Loop B Hunch: the problem is geometry, not the model. Non-centering keeps every latent at unit scale so one step size works everywhere. Rule: hierarchical scale + weak data => write latents non-centered. Same pattern used in Ch 11 Loop D.
    Loop C
        Diagnostics as a checklist in practice
            - technical: Loop C Try: for each diagnostic list the threshold, the typical fix, and one place in the book it has shown up.
        R-hat and ESS vs run length
            - technical: Loop C supporting sweep: refit the coin model at 200/400/800/1500/3000 post-tuning draws per chain; R-hat shrinks toward 1, ESS grows roughly linearly with draws. Image rhat_ess_curves.png.
            - code: generate.render_rhat_ess_curves (data seed 303; sampler seeds 606+d)
        Trace / rank plots for multimodality
            - technical: Loop C Observe: the eye is still the best detector for chains stuck in different modes; R-hat will flag it but the trace plot explains what is happening.
        Reparameterize, tune longer, or accept the limit
            - story: Fixes listed: reparameterize (centered -> non-centered), longer warmup, tighter priors, simpler models, or move to variational inference for very high-dimensional cases.
            - technical: Loop C Observe prescribes the same fixes per diagnostic: more warmup, non-centering, target_accept=0.95, more draws.
        Diagnostics are layered
            - technical: Loop C Hunch: passing R-hat but failing ESS = converged but noisy. Failing R-hat with zero divergences = not run long enough or hostile parameterization. Passing everything except a near-zero divergence count = quiet warning geometry will bite on slightly different data.
        Run the diagnostics, then sanity-check by hand
            - play: [play/mcmc_health_check.py](chapters/A1-mcmc-diagnostics/play/mcmc_health_check.py)
    Loop A
        Practical takeaway: don't trust an undiagnosed posterior
            - story: Print diagnostics for every model; PyMC's summary makes it easy. Don't trust a posterior you have not diagnosed.
            - technical: Appendix's practical-advice line, echoed in Loop A Hunch and Loop C Hunch.
        Hand-off: priors that regularize without pretending
            - story: No forward question for an appendix; the book ends at Ch 19. Appendix is a tool for rigorous use of the machinery.
            - technical: Closing section points forward to Appendix A2 (hierarchical companion) for prior choices on population-level tau and mu.
Appendix A2: hierarchical
    Framing
        Carry-over from A1: what is the model doing when the sampler is healthy?
            - technical: Framing: diagnostics are green, now understand hierarchical pooling itself.
        The partial-pooling idea in one paragraph
            - story: Per-segment effects come from a population distribution; small noisy segments should be pulled toward the population center.
            - technical: Implicit motivation for Loops A-C.
        Stein paradox as historical anchor
            - story: Charles Stein, 1956: shrinking three or more means toward the grand mean is uniformly better than estimating each independently.
            - technical: Not covered (story-only real-world stage).
        Real-world hierarchical settings
            - story: Education (per-school effects), sports (pitcher ERA after 50 vs 500 innings), genomics (thousands of variants).

    Loop A
        Naive vs hierarchical with 50 cities
            - story: A/B test across 50 cities: per-city z-test inflates false-alarm rate; hierarchical model jointly learns mu, tau, per-city effects.

        Partial pooling is the right estimator, not a compromise
            - story: Partial pooling matches the actual data-generating process; it is not a middle-ground kludge but the honest estimator.
            - technical: Loop A Hunch: matches the actual data-generating process; weights small segments by their information content.
    Loop B
        Three tau scenarios: nearly identical, moderate, wildly different
            - story: Tau is the dial that says how different the segments really are; tiny tau means glue everything to the population mean, large tau means barely pool at all.
            - technical: Loop B Try: tau_true = 0.005, 0.04, 0.15; same hierarchical model, same HalfNormal(0.1) prior on tau, K=8 segments of size 400.

        Shrinkage factor on the logit scale
            - story: Shrinkage is a quantity I can read off the posterior: how far each segment got pulled from its own data toward the population mean.
            - technical: Loop B Try: shrinkage_i = (independent_i - posterior_mean_i) / (independent_i - mu_posterior_mean).
            - code: generate.render_tau_learned
        Posterior on tau tracks the truth
            - story: When segments are identical, the posterior on tau lands near zero and pooling is heavy. When segments really differ, tau lands away from zero and pooling is light.
            - technical: Loop B Observe: posterior on tau concentrates near 0, 0.04, 0.15 respectively; average shrinkage ~1, ~0.4, <0.1. Image tau_learned.png.
            - code: generate.render_tau_learned
        Pooling strength is learned, not chosen
            - story: Tau is learned, not set. I do not pick the pooling strength; the data tells me what it should be.

    Loop C
        Prior on tau matters when N is small
            - story: With lots of data the prior on tau is essentially irrelevant. With little data it is the strongest lever in the room.

<script>
(function() {

function buildTree(text) {
  const lines = text.split('\n');
  const root = { raw: '', indent: -1, children: [], lineIdx: -1 };
  const stack = [root];
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (raw.trim() === '') continue;
    const indent = raw.search(/\S/);
    const content = raw.trim();
    while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
    const node = { raw: content, indent, children: [], lineIdx: i };
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  return root.children;
}

function isPropertyLine(raw) {
  return /^-?\s*\w[\w\s/&'()\-]*?:\s/.test(raw);
}

function classifyNode(node, depth) {
  const raw = node.raw;
  const name = raw.replace(/^-\s*/, '').replace(/:$/, '').trim();
  if (!name && node.children.length === 0) return null;

  if (node.children.length === 0) {
    return { type: 'item', name, depth, properties: {}, childTexts: [] };
  }

  const allProp = node.children.every(c => isPropertyLine(c.raw) || (c.children.length === 0));
  const hasPropChild = node.children.some(c => isPropertyLine(c.raw));

  if (allProp && hasPropChild) {
    const item = { type: 'item', name, depth, properties: {}, childTexts: [] };
    for (const child of node.children) {
      const m = child.raw.match(/^-?\s*(\w[\w\s/&'()\-]*?):\s+(.+)$/);
      if (m) {
        item.properties[m[1].trim().toLowerCase()] = m[2].trim();
      } else {
        const t = child.raw.replace(/^-\s*/, '').trim();
        if (t) item.childTexts.push(t);
      }
    }
    return item;
  }

  const children = [];
  for (const c of node.children) {
    const cls = classifyNode(c, depth + 1);
    if (cls) children.push(cls);
  }
  return { type: 'section', name, depth, children };
}

function classifyTree(rawNodes) {
  const result = [];
  for (const n of rawNodes) {
    const c = classifyNode(n, 0);
    if (c) result.push(c);
  }
  return result;
}

function escHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function linkify(text) {
  if (!text) return '';
  // First http(s) URLs
  let out = text.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Then markdown [text](url) — URL is taken verbatim (already a relative path)
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  return out;
}

function countDescendantItems(node) {
  let c = 0;
  for (const child of (node.children || [])) {
    if (child.type === 'item') c++;
    c += countDescendantItems(child);
  }
  return c;
}

function renderNodes(container, nodes) {
  for (const node of nodes) {
    if (node.type === 'section') renderSection(container, node);
    else renderItem(container, node);
  }
}

function renderSection(container, node) {
  const sec = document.createElement('div');
  sec.className = 'sec';
  sec.dataset.depth = node.depth || 0;
  const count = countDescendantItems(node);
  sec.innerHTML = `
    <div class="sec-hdr">
      <span class="arr">▶</span>
      <span class="sec-title">${escHtml(node.name)}</span>
      <span class="sec-meta"><span>${count || ''}</span></span>
    </div>
    <div class="sec-body"></div>`;
  sec.querySelector('.sec-hdr').addEventListener('click', () => sec.classList.toggle('open'));
  const body = sec.querySelector('.sec-body');
  if (node.children && node.children.length > 0) renderNodes(body, node.children);
  // NOTE: no auto-open. Everything starts folded.
  container.appendChild(sec);
}

function renderItem(container, node) {
  const item = document.createElement('div');
  item.className = 'item';
  item.dataset.depth = node.depth || 0;
  item.dataset.name = (node.name || '').toLowerCase();
  const props = node.properties || {};
  const hasDetail = Object.keys(props).length > 0 || (node.childTexts && node.childTexts.length > 0);
  item.innerHTML = `
    <div class="item-hdr">
      <div class="item-info">
        <div class="item-name">${linkify(escHtml(node.name))}</div>
      </div>
    </div>`;
  if (hasDetail) {
    const detail = document.createElement('div');
    detail.className = 'item-detail';
    const keys = Object.keys(props);
    if (keys.length > 0) {
      const grid = document.createElement('div');
      grid.className = 'dg';
      const order = ['story', 'technical', 'code', 'play'];
      const sortedKeys = keys.sort((a, b) => {
        const ai = order.indexOf(a), bi = order.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });
      for (const k of sortedKeys) {
        const v = props[k];
        grid.innerHTML += `<span class="dk">${escHtml(k)}</span><span class="dv">${linkify(escHtml(v))}</span>`;
      }
      detail.appendChild(grid);
    }
    for (const t of (node.childTexts || [])) {
      const line = document.createElement('div');
      line.className = 'dv';
      line.innerHTML = linkify(escHtml(t));
      detail.appendChild(line);
    }
    item.appendChild(detail);
    item.querySelector('.item-hdr').addEventListener('click', () => item.classList.toggle('open'));
  }
  container.appendChild(item);
}

function filterTree(query) {
  const q = query.trim().toLowerCase();
  const items = document.querySelectorAll('.item');
  const sections = document.querySelectorAll('.sec');
  if (!q) {
    items.forEach(el => { el.style.display = ''; el.classList.remove('open'); });
    sections.forEach(el => { el.style.display = ''; el.classList.remove('open'); });
    document.getElementById('search-count').textContent = '';
    return;
  }
  let visible = 0;
  items.forEach(el => {
    const text = el.textContent.toLowerCase();
    if (text.includes(q)) {
      el.style.display = '';
      el.classList.add('open');
      visible++;
    } else {
      el.style.display = 'none';
      el.classList.remove('open');
    }
  });
  const secArr = Array.from(sections).reverse();
  for (const sec of secArr) {
    const visibleChild = sec.querySelector('.item:not([style*="display: none"]), .sec:not([style*="display: none"])');
    const titleMatch = sec.querySelector('.sec-title').textContent.toLowerCase().includes(q);
    if (visibleChild || titleMatch) {
      sec.style.display = '';
      sec.classList.add('open');
      if (titleMatch && !visibleChild) {
        sec.querySelectorAll('.item').forEach(i => { i.style.display = ''; visible++; });
        sec.querySelectorAll('.sec').forEach(s => { s.style.display = ''; s.classList.add('open'); });
      }
    } else {
      sec.style.display = 'none';
      sec.classList.remove('open');
    }
  }
  document.getElementById('search-count').textContent = `${visible} match${visible !== 1 ? 'es' : ''}`;
}

function main() {
  const dataEl = document.getElementById('loglog-data');
  const text = (dataEl.textContent || '').replace(/^\n+/, '');
  const tree = buildTree(text);
  const nodes = classifyTree(tree);

  const content = document.getElementById('content');
  content.innerHTML = '';
  renderNodes(content, nodes);

  let totalItems = 0;
  function count(ns) { for (const n of ns) { if (n.type === 'item') totalItems++; if (n.children) count(n.children); } }
  count(nodes);
  document.getElementById('stats').textContent = `${totalItems} concepts across ${nodes.length} chapters`;

  document.getElementById('search').addEventListener('input', e => filterTree(e.target.value));
}

document.addEventListener('DOMContentLoaded', main);

})();
</script>
</body>
</html>

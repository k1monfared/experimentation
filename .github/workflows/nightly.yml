name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC, off the round-hour rush
  workflow_dispatch: {}

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run all tests including slow PyMC
        run: pytest --tb=short

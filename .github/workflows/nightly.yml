name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC, off the round-hour rush
  workflow_dispatch: {}

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run all tests including slow PyMC
        run: pytest --tb=short

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Snapshot manifest before regeneration
        run: cp data/manifest.yaml /tmp/manifest_before.yaml
      - name: Regenerate every chapter
        run: python scripts/regenerate_all.py
      - name: Diff manifest
        run: |
          if ! diff -u /tmp/manifest_before.yaml data/manifest.yaml; then
            echo "::error::data/manifest.yaml drifted after regenerate_all.py. Either checksums changed (an artifact regenerated nondeterministically) or new artifacts appeared. Inspect the diff above."
            exit 1
          fi
          echo "manifest matches: regeneration is deterministic"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expkit"
version = "0.1.0"
description = "A library that grows alongside a conversational walkthrough of experimentation, from coin tosses to causal handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "k1monfared" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "pymc>=5.10",
    "arviz>=0.17",
    "netcdf4>=1.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter>=1",
    "nbconvert>=7",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
include = ["expkit*"]
exclude = ["tests*", "chapters*", "scripts*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: tests that exercise PyMC sampling (skipped by default with -m 'not slow')",
]
